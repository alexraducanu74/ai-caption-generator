sonar.projectKey=alexraducanu74_CaptionGenerator
sonar.projectName=Caption Generator API
sonar.organization=alexraducanu74
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=.
sonar.exclusions=**/bin/**,**/obj/**,.git/**,.github/**,**/Tests/**,**/Migrations/**

# Coverage configuration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverage.exclusions=**/Tests/**,**/Migrations/**,**/Program.cs

# Quality Gate
sonar.qualitygate.wait=true

# Minimum coverage threshold
sonar.coverage.minCoverageRatio=0.60
