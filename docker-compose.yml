services:
  postgres:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql
    container_name: caption-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caption_generator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caption-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caption-generator-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=caption_generator;Username=postgres;Password=postgres;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - caption-network

networks:
  caption-network:
    driver: bridge

volumes:
  postgres_data: