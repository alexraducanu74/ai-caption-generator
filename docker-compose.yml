services:
  postgres:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql
    container_name: caption-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caption_generator
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caption-network

  caption-service:
    build:
      context: ./caption-service
      dockerfile: Dockerfile
    container_name: caption-generator-caption
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.loads(urllib.request.urlopen('http://localhost:8000/health', timeout=25).read().decode()); status=data.get('status'); err=data.get('lastError'); raise SystemExit(0 if status in ('starting','ready') and not err else 1)"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 180s
    networks:
      - caption-network
    gpus: all

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caption-generator-api
    depends_on:
      postgres:
        condition: service_healthy
      caption-service:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=caption_generator;Username=postgres;Password=postgres;"
      ASPNETCORE_ENVIRONMENT: Development
      CaptionGeneration__BaseUrl: "http://caption-service:8000"
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - caption-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: caption-generator-web
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - caption-network

networks:
  caption-network:
    driver: bridge

volumes:
  postgres_data:
  hf_cache:
