services:
  postgres:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql
    container_name: caption-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caption_generator
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caption-network

  caption-service:
    build:
      context: ./caption-service
      dockerfile: Dockerfile
    container_name: caption-generator-caption
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - caption-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caption-generator-api
    depends_on:
      postgres:
        condition: service_healthy
      caption-service:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=caption_generator;Username=postgres;Password=postgres;"
      ASPNETCORE_ENVIRONMENT: Development
      CaptionGeneration__BaseUrl: "http://caption-service:8000"
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - caption-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: caption-generator-web
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - caption-network

networks:
  caption-network:
    driver: bridge

volumes:
  postgres_data:
  hf_cache:
