name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}
  PROJECT_NAME: caption-generator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-api:latest
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-api:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Service image
        uses: docker/build-push-action@v4
        with:
          context: caption-service
          file: ./caption-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-service:latest
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-service:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-web:latest
            ${{ secrets.AZURE_REGISTRY_URL }}/caption-web:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save deployment info
        run: |
          echo "version=${{ steps.version.outputs.version }}" >> deployment.properties
          echo "artifact_version=${{ github.run_number }}" >> deployment.properties

      - name: Upload deployment info
        uses: actions/upload-artifact@v3
        with:
          name: deployment-info
          path: deployment.properties
          retention-days: 30

  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deployment.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment info
        uses: actions/download-artifact@v3
        with:
          name: deployment-info

      - name: Load deployment info
        id: deploy-info
        run: |
          source deployment.properties
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file azure/infrastructure.bicep \
            --parameters \
              location=${{ secrets.AZURE_LOCATION }} \
              environment=${{ github.event.inputs.environment || 'dev' }} \
              projectName=${{ env.PROJECT_NAME }}

      - name: Update Container App - API
        run: |
          az containerapp update \
            --name "${{ env.PROJECT_NAME }}-api" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_URL }}/caption-api:${{ steps.deploy-info.outputs.version }}

      - name: Update Container App - AI Service
        run: |
          az containerapp update \
            --name "${{ env.PROJECT_NAME }}-ai" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_URL }}/caption-service:${{ steps.deploy-info.outputs.version }}

      - name: Deployment status
        id: deployment
        run: |
          API_URL=$(az containerapp show \
            --name "${{ env.PROJECT_NAME }}-api" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://${API_URL}" >> $GITHUB_OUTPUT
          echo "✅ Deployment completed successfully!"

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test CaptionGenerator.Tests.Unit/CaptionGenerator.Tests.Unit.csproj --verbosity normal

      - name: Run integration tests
        run: dotnet test CaptionGenerator.Tests.Integration/CaptionGenerator.Tests.Integration.csproj --verbosity normal

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: '**/TestResults/'

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-azure, test]
    if: always()

    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        if: secrets.SLACK_WEBHOOK != ''

